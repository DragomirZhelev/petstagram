{% extends 'shared/base.html' %}
{% load static %}

{% block content %}

    <!-- Start Delete Profile Section -->
    <div class="delete-profile">

        <h1>
            Are you sure you want to delete your profile?
        </h1>

        <div class="sure-buttons">

            <!-- Yes - Delete Profile -->
            <form method="post">
                {% csrf_token %}
                <button type="submit">Yes</button>
            </form>

            <!-- Go Back -->
            <a class="edit-btn"
               href="{% url 'accounts:profile_details' pk=request.user.pk %}">
                Go Back
            </a>

        </div>

        <img src="{% static 'images/are_you_sure_cat.gif' %}"
             alt="are you sure cat gif">

    </div>
    <!-- End Delete Profile Section -->

{% endblock %}
